<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnimeVocab: getting started</title>
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <span class="hanko" aria-hidden>アニ</span>
      <div>
        <h1 id="head-title">AnimeVocab is installed</h1>
        <p class="sub" id="head-sub">Three steps to your first card. The first one is watching anime.</p>
      </div>
    </header>

    <!-- Filled in once the first card is mined; empty and hidden until then. -->
    <section class="celebrate" id="celebrate" aria-live="polite" hidden></section>

    <!-- Rendered from ONBOARDING_STEPS so this page and the popup checklist
         cannot drift into describing two different products. -->
    <ol class="steps" id="steps"></ol>

    <!-- Sign-in lives below the steps and never blocks them: nobody should be
         asked to make an account before they have seen the thing work (#77). -->
    <section class="signin" id="account" aria-live="polite"></section>

    <footer class="foot">
      <p>Nothing you watch leaves this browser except the words you save. <button type="button" class="link" data-act="privacy">Privacy</button> · <button type="button" class="link" data-act="settings">Settings</button> · <button type="button" class="link" data-act="dashboard">Dashboard</button></p>
    </footer>
  </main>

  <script src="welcome.js"></script>
</body>
</html>
