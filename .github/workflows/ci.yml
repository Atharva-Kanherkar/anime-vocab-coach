name: CI

# Prod-fidelity gate: every job runs the same commands (and where possible the
# same build) that production runs, so a green CI means the code will deploy
# and work. Called by deploy.yml before anything ships (issue #42).

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extension:
    name: Extension — typecheck, unit tests, e2e, pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11; all three package-lock.json files are
          # lockfileVersion 3 generated by npm 11. npm 10 rejects them.
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Every self-contained extension suite against the real unpacked
      # extension in Chromium (it used to be the cue-text one alone). None of
      # them reaches production: see e2e/support/no-production.mjs.
      - name: E2E — extension suites
        run: npm run test:e2e:ci

      - name: Pack extension (the exact zip deploy ships)
        run: npm run pack

      - name: E2E — the packed zip loads and runs
        run: npm run verify:package

      # extension/*.js is committed, and it is what a contributor loads
      # unpacked. `pack` above just rebuilt it from src/, so any diff here
      # means someone changed source without committing the rebuilt bundle.
      - name: Committed bundles match src/
        run: |
          if ! git diff --quiet -- extension; then
            echo "::error::extension/ is stale — run 'npm run build' and commit the result."
            git diff --stat -- extension
            exit 1
          fi

  web:
    name: Web — lint, typecheck, unit tests, prod build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: ESLint (errors fail the build)
        run: npx eslint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      # The same build command `npm run deploy` runs in deploy.yml, minus the
      # upload — catches next build / OpenNext bundling breakage before merge.
      # Clerk env mirrors deploy.yml so the compiled output matches prod
      # (empty on forks, where the build still succeeds without keys).
      - name: Production build (opennextjs-cloudflare)
        env:
          NEXT_PUBLIC_CLERK_ENABLED: "true"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PROXY_URL: https://animevocab.com/__clerk
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /app
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /app
        run: npx opennextjs-cloudflare build

  backend:
    name: Backend — typecheck, unit tests, wrangler dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Wrangler dry-run (validates the exact deploy bundle)
        run: npx wrangler deploy --dry-run --outdir=/tmp/wrangler-dry-run --config wrangler.toml

      # Real workerd (wrangler dev): 50 simultaneous meter writes must all
      # count, and a mint budget must hold under a burst.
      - name: E2E — atomic meter and mint budget
        run: node e2e/concurrency.mjs . --expect-atomic

  web-e2e:
    name: Web — Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start dev server (Clerk bypass)
        run: |
          NEXT_PUBLIC_AVC_DEV_NO_CLERK=1 PORT=3400 npm run dev > /tmp/nextdev.log 2>&1 &
          echo $! > /tmp/nextdev.pid
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3400/ && exit 0
            sleep 2
          done
          echo "dev server never became ready" >&2
          cat /tmp/nextdev.log >&2
          exit 1

      - name: Run e2e core loop
        run: SKIP_AI=1 node e2e/core-loop.mjs

      # Lives with the extension e2e (it plays the extension's side of the
      # bridge), so it resolves playwright from the root install.
      - name: Install root dependencies (for e2e/app-link-status.mjs)
        working-directory: .
        run: npm ci

      - name: Run e2e /app extension-link banner (#133)
        run: node ../e2e/app-link-status.mjs http://localhost:3400

      # The /owner suites start their own dev server with a mocked Analytics
      # Engine; two dev servers cannot share web/.next.
      - name: Stop the shared dev server
        # The saved pid is npm's; next dev is its child, so match the server.
        run: pkill -f "next dev" || true; sleep 3

      - name: Run e2e /owner observability, scope and Pro funnel
        run: |
          node e2e/observability.mjs
          node e2e/owner-scope.mjs
          node e2e/pro-entry.mjs

      - name: Dev server log (on failure)
        if: failure()
        run: cat /tmp/nextdev.log
